<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Ulusal Kurtuluş | Türkiye Yönetim Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a2f5a;
            font-family: 'Segoe UI', 'Roboto', 'Corbel', 'Trebuchet MS', sans-serif;
            color: #FFD966;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .top-bar {
            background-color: #04273f;
            padding: 0.7rem 2rem;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 1rem;
            border-bottom: 1px solid #FFD96655;
            flex-wrap: wrap;
        }
        .admin-btn {
            background: #FFD96622;
            border: 1px solid #FFD966;
            color: #FFD966;
            padding: 6px 16px;
            border-radius: 40px;
            cursor: pointer;
            font-weight: bold;
        }
        .admin-btn:hover {
            background: #FFD966;
            color: #0a2f5a;
        }
        .dashboard {
            display: flex;
            flex: 1;
            flex-wrap: wrap;
        }
        .sidebar {
            width: 280px;
            background-color: #063256;
            border-right: 1px solid #FFD966;
            padding: 1rem 0 2rem 0;
            overflow-y: auto;
        }
        .logo-area {
            text-align: center;
            padding: 0 1rem 1rem 1rem;
            border-bottom: 1px solid rgba(255, 217, 102, 0.3);
            margin-bottom: 1rem;
        }
        .modul-listesi {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }
        .modul-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-right: 0.5rem;
        }
        .modul-btn {
            background: transparent;
            border: none;
            text-align: left;
            padding: 0.8rem 1rem;
            font-size: 0.95rem;
            font-weight: 600;
            color: #FFD966;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
            font-family: inherit;
            flex: 1;
        }
        .modul-btn.active {
            background-color: #0e4270;
            border-left-color: #FFD966;
        }
        .admin-controls {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .edit-btn, .delete-btn {
            background: none;
            border: none;
            color: #FFD966;
            cursor: pointer;
            font-size: 1.1rem;
            opacity: 0.7;
        }
        .edit-btn:hover, .delete-btn:hover { opacity: 1; }
        .main-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }
        .content-card {
            background: rgba(6, 50, 86, 0.7);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid #FFD96655;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        .content-card h1 { font-size: 1.8rem; border-bottom: 2px solid #FFD966; display: inline-block; margin-bottom: 1rem; }
        .highlight {
            background: #FFD96620;
            border-left: 4px solid #FFD966;
            padding: 0.8rem 1.2rem;
            margin: 1rem 0;
            border-radius: 8px;
        }
        .footer {
            background-color: #04273f;
            border-top: 1px solid #FFD96655;
            padding: 1rem;
            text-align: center;
            font-size: 0.85rem;
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000000aa;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #0a2f5a;
            border: 2px solid #FFD966;
            border-radius: 20px;
            padding: 2rem;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-content textarea {
            width: 100%;
            min-height: 300px;
            background: #fff3dd;
            border-radius: 16px;
            padding: 12px;
            font-family: monospace;
        }
        button {
            background: #FFD966;
            color: #0a2f5a;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .paket-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            margin: 1rem 0;
        }
        .paket-card {
            background: #0a2f5a;
            border: 1px solid #FFD966;
            border-radius: 20px;
            padding: 1rem;
            width: 200px;
            text-align: center;
        }
        .wa-buton { background: #25D366; color: black; margin-top: 8px; }
        @media (max-width: 780px) {
            .dashboard { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div id="adminStatus">👤 Ziyaretçi</div>
    <button class="admin-btn" id="adminLoginBtn">🔐 Yönetici Girişi</button>
</div>

<div class="dashboard">
    <div class="sidebar">
        <div class="logo-area">
            <h2>⚡ MİLLİ UYANIŞ</h2>
            <p>Kurtuluş · Örgütlenme · Yaşam Planı</p>
        </div>
        <div id="modulListesi" class="modul-listesi"></div>
        <div id="yeniModulAlan" style="padding: 1rem; display: none; border-top: 1px solid #FFD96655; margin-top: 1rem;">
            <input type="text" id="yeniModulAd" placeholder="Yeni modül adı" style="width:100%; padding:6px; border-radius:20px; margin-bottom:8px;">
            <button id="yeniModulKaydet" style="width:100%">➕ Yeni Modül Ekle</button>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div class="content-card">Yükleniyor...</div>
    </div>
</div>

<footer class="footer">
    <p>✦ <strong>SİSTEM KURUCU: CFO Müh. Orhan Boyraz</strong> ✦</p>
    <p>Adres: Nilüfer/Bursa | Tel: 0540 966 6602 | Mail: orhanboyraz0216@gmail.com</p>
    <p>“Mahallende örgütlen, Kurumunda örgütlen, komşuna ‘yalnız değilsin’ de.”</p>
</footer>

<script>
    // ----- Varsayılan Modüller (sabit ID'ler, içerikler değiştirilebilir) -----
    const defaultModules = {
        "giris": { baslik: "🏠 GİRİŞ & ZAMAN", icerik: `<h1>GİRİŞ</h1><p>Bu manifesto milletin vicdanıdır. Sen yalnız değilsin.</p><div class="highlight">Çaresizlik hipnozunu bozuyoruz.</div>` },
        "teshis": { baslik: "🔍 1. BÜYÜK TEŞHİS", icerik: `<h1>BÜYÜK TEŞHİS</h1><h2>Ekonomik Çöküş</h2><p>Enflasyon kader değildir. İsraf ve yolsuzluk düzeni.</p><h2>Demografik Kriz</h2><p>Torpil ve liyakatsizlik gençleri yok ediyor.</p>` },
        "degerler": { baslik: "🕊️ 2. ORTAK DEĞERLER", icerik: `<h1>Evrensel Değerler</h1><ul><li>Mutlak Adalet</li><li>Şeffaflık</li><li>Liyakat</li></ul>` },
        "ekip": { baslik: "⚙️ 3. ERDEMLİ EKİP", icerik: `<h1>Gölge Kabine</h1><p>Konsensüs Kurulu, organik ağlar, hiyerarşisiz koordinasyon.</p>` },
        "catlak": { baslik: "🌿 4. ÖRGÜTLENME & ÇATLAK", icerik: `<h1>Mahalle Meclisleri</h1><p>Dayanışma hücreleri, takas havuzları, iktidarı çözme stratejisi.</p>` },
        "soylem": { baslik: "📢 5. SÖYLEM & SOSYAL MEDYA", icerik: `<h1>Şiddetsiz Direniş</h1><p>Vergi takibi, israf ifşası, dijital dashboard.</p>` },
        "donusum": { baslik: "🏛️ 6. YAPISAL DÖNÜŞÜM", icerik: `<h1>Yeni Piramit</h1><p>Köylü Odaları, Esnaf Meclisleri, Blockchain liyakat.</p>` },
        "ai": { baslik: "🤖 7.YAPAY ZEKA ASİSTANI", icerik: `<h1>YZ Asistan</h1><div><textarea id="aiSoru" rows="2" placeholder="Sorunuz..." style="width:100%"></textarea><button id="aiSorBtn">Sor</button><div id="aiCevap" class="highlight"></div></div>` },
        "fon": { baslik: "💰 8.DAYANIŞMA FONU", icerik: `<h1>Dayanışma Fonu</h1><div id="fonTutar">0 TL</div><button data-miktar="10">10 TL Bağış</button><button data-miktar="50">50 TL Bağış</button>` },
        "abonelik": { baslik: "📦 9.ABONELİK PAKETLERİ", icerik: `<h1>WhatsApp Paketleri</h1><div class="paket-grid" id="paketGrid"></div>` },
        "duyurular": { baslik: "📢 10.DUYURULAR", icerik: `<h1>Duyurular</h1><div id="duyuruListesi">Yükleniyor...</div><div id="adminDuyuruPanel" style="display:none;"><input type="text" id="duyuruBaslik" placeholder="Başlık"><textarea id="duyuruIcerik" placeholder="İçerik"></textarea><button id="duyuruEkle">Duyuru Ekle</button><div id="duyuruSilListe"></div></div>` }
    };

    // localStorage yönetimi
    let modules = {};
    let adminLogged = false;
    let activeModuleId = "giris";

    function loadModules() {
        const stored = localStorage.getItem("kurtulus_editor_modules");
        if(stored) {
            modules = JSON.parse(stored);
        } else {
            modules = JSON.parse(JSON.stringify(defaultModules));
            // her module'e sabit bir id ata
            saveModules();
        }
    }
    function saveModules() {
        localStorage.setItem("kurtulus_editor_modules", JSON.stringify(modules));
    }

    // modül listesini render et (sidebar)
    function renderSidebar() {
        const container = document.getElementById("modulListesi");
        if(!container) return;
        container.innerHTML = "";
        for(let [id, mod] of Object.entries(modules)) {
            const wrapper = document.createElement("div");
            wrapper.className = "modul-item";
            const btn = document.createElement("button");
            btn.className = "modul-btn" + (activeModuleId === id ? " active" : "");
            btn.innerText = mod.baslik || id;
            btn.onclick = (e) => {
                e.stopPropagation();
                setActiveModule(id);
            };
            wrapper.appendChild(btn);
            if(adminLogged) {
                const controls = document.createElement("div");
                controls.className = "admin-controls";
                const editBtn = document.createElement("button");
                editBtn.innerHTML = "✏️";
                editBtn.className = "edit-btn";
                editBtn.title = "Düzenle";
                editBtn.onclick = (e) => {
                    e.stopPropagation();
                    openEditor(id);
                };
                const delBtn = document.createElement("button");
                delBtn.innerHTML = "🗑️";
                delBtn.className = "delete-btn";
                delBtn.title = "Sil";
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    if(confirm("Bu modülü silmek istediğinize emin misiniz?")) {
                        delete modules[id];
                        saveModules();
                        if(activeModuleId === id) {
                            const firstId = Object.keys(modules)[0];
                            if(firstId) setActiveModule(firstId);
                            else setActiveModule(null);
                        }
                        renderSidebar();
                        if(activeModuleId && modules[activeModuleId]) renderContent(activeModuleId);
                        else document.getElementById("mainContent").innerHTML = `<div class="content-card"><h1>Modül yok</h1><p>Yeni modül ekleyin.</p></div>`;
                    }
                };
                controls.appendChild(editBtn);
                controls.appendChild(delBtn);
                wrapper.appendChild(controls);
            }
            container.appendChild(wrapper);
        }
    }

    function openEditor(moduleId) {
        const mod = modules[moduleId];
        if(!mod) return;
        const newContent = prompt("Modül içeriğini HTML formatında düzenleyin (başlık, paragraf, liste vb.):", mod.icerik);
        if(newContent !== null) {
            mod.icerik = newContent;
            saveModules();
            if(activeModuleId === moduleId) renderContent(moduleId);
            renderSidebar(); // baslık değişmedi ama içerik güncellendi
        }
        const newTitle = prompt("Modül başlığını düzenleyin (emoji ve metin):", mod.baslik);
        if(newTitle !== null) {
            mod.baslik = newTitle;
            saveModules();
            renderSidebar();
        }
    }

    // Özel içerik render (AI, fon, abonelik, duyurular dinamik)
    function renderContent(moduleId) {
        const container = document.getElementById("mainContent");
        const mod = modules[moduleId];
        if(!mod) { container.innerHTML = `<div class="content-card">Modül bulunamadı.</div>`; return; }
        
        let html = `<div class="content-card">${mod.icerik}</div>`;
        container.innerHTML = html;
        
        // Dinamik scriptleri yeniden bağla
        if(moduleId === "ai") {
            const sorBtn = document.getElementById("aiSorBtn");
            if(sorBtn) sorBtn.onclick = () => {
                const soru = document.getElementById("aiSoru").value;
                let cevap = "Manifestoya göre: Örgütlen ve umutlu ol.";
                if(soru.includes("enflasyon")) cevap = "Enflasyon israf ve yolsuzluktan kaynaklanır. Yeni piramit sistem çözecek.";
                else if(soru.includes("torpil")) cevap = "Liyakat blockchain ile tescil edilecek.";
                else cevap = "Dervişane adalet ve stratejik birlikle kazanacağız.";
                document.getElementById("aiCevap").innerHTML = cevap;
            };
        }
        if(moduleId === "fon") {
            let toplam = localStorage.getItem("dayanisma_fonu") ? parseInt(localStorage.getItem("dayanisma_fonu")) : 28500;
            const fonDiv = document.getElementById("fonTutar");
            if(fonDiv) fonDiv.innerText = toplam.toLocaleString() + " TL";
            document.querySelectorAll("[data-miktar]").forEach(btn => {
                btn.onclick = () => {
                    let miktar = parseInt(btn.getAttribute("data-miktar"));
                    let yeni = (parseInt(localStorage.getItem("dayanisma_fonu"))||28500) + miktar;
                    localStorage.setItem("dayanisma_fonu", yeni);
                    if(fonDiv) fonDiv.innerText = yeni.toLocaleString() + " TL";
                    alert(`${miktar} TL bağış için teşekkürler!`);
                };
            });
        }
        if(moduleId === "abonelik") {
            const paketler = [
                { ad: "Dayanışma", fiyat: "99 TL" }, { ad: "Kalkınma", fiyat: "249 TL" },
                { ad: "Kurtuluş", fiyat: "499 TL" }, { ad: "Yüce Destek", fiyat: "999 TL" }
            ];
            const grid = document.getElementById("paketGrid");
            if(grid) {
                grid.innerHTML = "";
                paketler.forEach(p => {
                    const kart = document.createElement("div");
                    kart.className = "paket-card";
                    kart.innerHTML = `<strong>${p.ad}</strong><div>${p.fiyat}/ay</div><button class="wa-buton" data-paket="${p.ad}">WhatsApp Satın Al</button>`;
                    grid.appendChild(kart);
                });
                document.querySelectorAll(".wa-buton").forEach(btn => {
                    btn.onclick = () => window.open(`https://wa.me/905409666602?text=${encodeURIComponent(btn.getAttribute("data-paket") + " paketi almak istiyorum.")}`, "_blank");
                });
            }
        }
        if(moduleId === "duyurular") {
            renderDuyuruModulu();
            if(adminLogged) {
                const adminPanel = document.getElementById("adminDuyuruPanel");
                if(adminPanel) adminPanel.style.display = "block";
                document.getElementById("duyuruEkle").onclick = () => {
                    const baslik = document.getElementById("duyuruBaslik").value;
                    const icerik = document.getElementById("duyuruIcerik").value;
                    if(baslik && icerik) {
                        let duyurular = JSON.parse(localStorage.getItem("kurtulus_duyurulari") || "[]");
                        duyurular.unshift({ id: Date.now(), baslik, icerik });
                        localStorage.setItem("kurtulus_duyurulari", JSON.stringify(duyurular));
                        renderDuyuruModulu();
                        document.getElementById("duyuruBaslik").value = "";
                        document.getElementById("duyuruIcerik").value = "";
                    }
                };
            } else {
                const panel = document.getElementById("adminDuyuruPanel");
                if(panel) panel.style.display = "none";
            }
        }
    }

    function renderDuyuruModulu() {
        let duyurular = JSON.parse(localStorage.getItem("kurtulus_duyurulari") || "[]");
        const listeDiv = document.getElementById("duyuruListesi");
        if(listeDiv) {
            if(duyurular.length===0) listeDiv.innerHTML = "<p>Duyuru yok</p>";
            else {
                let html = "";
                duyurular.forEach(d => { html += `<div style="background:#0e3d66; margin:8px 0; padding:12px; border-radius:16px;"><strong>${escapeHtml(d.baslik)}</strong><p>${escapeHtml(d.icerik)}</p></div>`; });
                listeDiv.innerHTML = html;
            }
        }
        const silListe = document.getElementById("duyuruSilListe");
        if(silListe && adminLogged) {
            silListe.innerHTML = "<h4>Duyuru Silme</h4>";
            duyurular.forEach(d => {
                const div = document.createElement("div");
                div.innerHTML = `<span>${escapeHtml(d.baslik)}</span> <button class="silBtn" data-id="${d.id}">Sil</button>`;
                silListe.appendChild(div);
            });
            document.querySelectorAll(".silBtn").forEach(btn => {
                btn.onclick = () => {
                    let id = parseInt(btn.getAttribute("data-id"));
                    let yeniListe = duyurular.filter(d => d.id !== id);
                    localStorage.setItem("kurtulus_duyurulari", JSON.stringify(yeniListe));
                    renderDuyuruModulu();
                    renderContent("duyurular");
                };
            });
        }
    }

    function setActiveModule(id) {
        activeModuleId = id;
        renderSidebar();
        renderContent(id);
    }

    function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }

    // Admin giriş
    function updateAdminUI() {
        renderSidebar();
        const yeniAlan = document.getElementById("yeniModulAlan");
        if(yeniAlan) yeniAlan.style.display = adminLogged ? "block" : "none";
        if(activeModuleId === "duyurular") renderContent("duyurular");
        document.getElementById("adminStatus").innerText = adminLogged ? "👑 Yönetici" : "👤 Ziyaretçi";
        document.getElementById("adminLoginBtn").innerText = adminLogged ? "🚪 Çıkış" : "🔐 Yönetici Girişi";
    }

    document.getElementById("adminLoginBtn").onclick = () => {
        if(adminLogged) {
            adminLogged = false;
            sessionStorage.removeItem("admin_logged");
            updateAdminUI();
        } else {
            const pwd = prompt("Şifre:");
            if(pwd === "kurtulus2026") {
                adminLogged = true;
                sessionStorage.setItem("admin_logged", "true");
                updateAdminUI();
            } else alert("Şifre yanlış");
        }
    };

    // Yeni modül ekleme
    document.getElementById("yeniModulKaydet").onclick = () => {
        if(!adminLogged) return alert("Önce yönetici girişi yapın.");
        const ad = document.getElementById("yeniModulAd").value.trim();
        if(!ad) return alert("Modül adı girin");
        const newId = "mod_" + Date.now();
        modules[newId] = {
            baslik: ad,
            icerik: `<h1>${ad}</h1><p>Bu modülün içeriğini düzenlemek için ✏️ butonuna tıklayın.</p>`
        };
        saveModules();
        renderSidebar();
        setActiveModule(newId);
        document.getElementById("yeniModulAd").value = "";
    };

    // başlangıç
    loadModules();
    const storedAdmin = sessionStorage.getItem("admin_logged") === "true";
    adminLogged = storedAdmin;
    updateAdminUI();
    if(Object.keys(modules).length) setActiveModule(Object.keys(modules)[0]);
    else setActiveModule(null);

    // Duyuru başlangıç verisi
    if(!localStorage.getItem("kurtulus_duyurulari")) localStorage.setItem("kurtulus_duyurulari", JSON.stringify([{ id: Date.now(), baslik: "Hoş Geldiniz", icerik: "Manifesto yayında. Tüm modülleri düzenleyebilirsiniz." }]));
    if(!localStorage.getItem("dayanisma_fonu")) localStorage.setItem("dayanisma_fonu", "28500");
</script>
</body>
</html>
